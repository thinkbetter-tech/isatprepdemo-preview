<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>iSATPrep — English, the math way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx?v=3"></script>
<script type="text/babel" src="sections.jsx?v=7"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "navy": "#152647",
  "purple": "#6D5BD0",
  "amber": "#F59E0B",
  "bg": "#FFFFFF",
  "headlineFont": "Inter",
  "bodyFont": "Inter"
}/*EDITMODE-END*/;

const DEMO_VIDEO_URL = "https://www.youtube.com/embed/z3ZQ-9Cn8TE";

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [demoOpen, setDemoOpen] = React.useState(false);

  // Apply tweaks to :root
  React.useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--navy', t.navy);
    r.setProperty('--navy-2', t.navy);
    r.setProperty('--purple', t.purple);
    r.setProperty('--amber', t.amber);
    r.setProperty('--bg', t.bg);
    r.setProperty('--serif', `"${t.headlineFont}", system-ui, sans-serif`);
    r.setProperty('--sans', `"${t.bodyFont}", system-ui, sans-serif`);
  }, [t]);

  // Load font dynamically if not in default link
  React.useEffect(() => {
    const families = [t.headlineFont, t.bodyFont];
    const id = 'dyn-fonts';
    let l = document.getElementById(id);
    const href = `https://fonts.googleapis.com/css2?${families.map(f => `family=${encodeURIComponent(f)}:wght@400;500;600;700`).join('&')}&display=swap`;
    if (!l) {
      l = document.createElement('link');
      l.id = id; l.rel = 'stylesheet';
      document.head.appendChild(l);
    }
    l.href = href;
  }, [t.headlineFont, t.bodyFont]);

  return (
    <div data-screen-label="Marketing Home">
      <Nav />
      <Hero onOpenDemo={() => { document.getElementById('walkthroughs')?.scrollIntoView({behavior:'smooth', block:'start'}); }} />
      <Problem />
      <Method />
      <Instructor />
      {/* <Demo onOpenDemo={() => { document.getElementById('walkthroughs')?.scrollIntoView({behavior:'smooth', block:'start'}); }} /> */}
      <Walkthroughs />
      <Topics />
      <Testimonials />
      <Pricing />
      <FAQ />
      <FinalCTA />
      <Footer />

      <VideoModal open={demoOpen} onClose={() => setDemoOpen(false)} url={DEMO_VIDEO_URL} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakColor label="Navy" value={t.navy} onChange={(v)=>setTweak('navy',v)} />
        <TweakColor label="Purple" value={t.purple} onChange={(v)=>setTweak('purple',v)} />
        <TweakColor label="Amber" value={t.amber} onChange={(v)=>setTweak('amber',v)} />
        <TweakColor label="Background" value={t.bg} onChange={(v)=>setTweak('bg',v)} />

        <TweakSection label="Typography" />
        <TweakSelect label="Headline" value={t.headlineFont}
          options={[
            {value:"Inter", label:"Inter (default)"},
            {value:"Geist", label:"Geist"},
            {value:"IBM Plex Sans", label:"IBM Plex Sans"},
            {value:"DM Sans", label:"DM Sans"},
          ]}
          onChange={(v)=>setTweak('headlineFont',v)} />
        <TweakSelect label="Body" value={t.bodyFont}
          options={[
            {value:"Inter", label:"Inter (default)"},
            {value:"Geist", label:"Geist"},
            {value:"IBM Plex Sans", label:"IBM Plex Sans"},
            {value:"DM Sans", label:"DM Sans"},
          ]}
          onChange={(v)=>setTweak('bodyFont',v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
